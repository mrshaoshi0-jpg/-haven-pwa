<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080b12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Haven">
  <meta name="description" content="Haven 離線私密相簿">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
  <title>Haven · 離線相簿</title>
</head>
<body>
  <div id="lockScreen" class="lock-screen">
    <div class="brand-mark">⌁</div>
    <h1>Haven</h1><p class="muted">你的離線私密相簿</p>
    <div id="setupArea" class="pin-area hidden">
      <p>首次使用，請設定 4–8 位數密碼</p>
      <input id="newPin" class="pin-input" inputmode="numeric" type="password" maxlength="8" placeholder="設定密碼" autocomplete="new-password">
      <input id="confirmPin" class="pin-input" inputmode="numeric" type="password" maxlength="8" placeholder="再次輸入密碼" autocomplete="new-password">
      <button id="setPinBtn" class="primary">設定密碼</button>
    </div>
    <div id="unlockArea" class="pin-area hidden">
      <p>輸入密碼以解鎖</p>
      <input id="pinInput" class="pin-input" inputmode="numeric" type="password" maxlength="8" placeholder="輸入密碼" autocomplete="current-password">
      <button id="unlockBtn" class="primary">解鎖</button>
    </div>
    <p id="lockMessage" class="message" role="status"></p>
    <p class="tiny muted">離線優先 · 資料儲存在此裝置的瀏覽器中</p>
  </div>

  <main id="app" class="app hidden">
    <header class="topbar">
      <div><div class="eyebrow">YOUR PRIVATE SPACE</div><h1>Haven</h1></div>
      <button id="lockBtn" class="icon-btn" aria-label="立即上鎖" title="立即上鎖">♙</button>
    </header>
    <section class="welcome">
      <div><h2 id="viewTitle">我的相簿</h2><p id="mediaCount" class="muted">你的照片，只留在你的裝置</p></div>
      <label class="add-btn">＋ 匯入<input id="filePicker" type="file" accept="image/*,video/*" multiple hidden></label>
    </section>
    <nav class="tabs" aria-label="相簿篩選">
      <button class="tab active" data-view="all">全部</button>
      <button class="tab" data-view="photos">照片</button>
      <button class="tab" data-view="videos">影片</button>
      <button class="tab" data-view="favorites">收藏</button>
    </nav>
    <div id="notice" class="notice hidden"></div>
    <section id="gallery" class="gallery"></section>
    <section id="emptyState" class="empty">
      <div class="empty-icon">▧</div><h3>這裡還是空的</h3>
      <p class="muted">匯入照片或影片，建立你的私人收藏。</p>
      <label class="primary import-empty">選擇照片與影片<input id="emptyPicker" type="file" accept="image/*,video/*" multiple hidden></label>
    </section>
    <footer class="footnote">Haven · 離線相簿 <span id="offlineState">檢查離線狀態…</span></footer>
  </main>

  <div id="viewer" class="viewer hidden">
    <div class="viewer-bar"><button id="closeViewer" class="icon-btn">‹</button><span id="viewerIndex"></span><button id="viewerMore" class="icon-btn">⋯</button></div>
    <div id="viewerContent" class="viewer-content"></div>
    <div class="viewer-actions">
      <button id="favoriteBtn" class="action-btn">♡ 收藏</button>
      <button id="shareBtn" class="action-btn">⇧ 分享</button>
      <button id="deleteBtn" class="action-btn danger">⌫ 刪除</button>
    </div>
  </div>
  <div id="confirmModal" class="modal hidden">
    <div class="modal-card"><h3 id="modalTitle">確認操作</h3><p id="modalText"></p><div class="modal-actions"><button id="cancelModal" class="secondary">取消</button><button id="confirmModalBtn" class="primary">確認</button></div></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
